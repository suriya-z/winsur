name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Frontend bundle
        run: npx vite build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Parity checklist
        shell: pwsh
        run: |
          $open = Select-String -Path docs/tauri-parity.md -Pattern '^- \[ \]'
          if ($open) {
            $open | ForEach-Object { Write-Host $_.Line }
            Write-Error "docs/tauri-parity.md still has unchecked items"
            exit 1
          }
          $done = Select-String -Path docs/tauri-parity.md -Pattern '^- \[x\]'
          if (-not $done) {
            Write-Error "docs/tauri-parity.md has no completed items"
            exit 1
          }

      - name: Package
        run: npm run dist

      - name: Installer sizes
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem -Path target/release/bundle/nsis -Filter *.exe -File)
            (Get-ChildItem -Path target/release/bundle/msi -Filter *.msi -File)
            (Get-Item target/release/winsur.exe)
          )
          if ($files.Count -lt 3) {
            Write-Error "expected NSIS, MSI, and winsur.exe under target/release"
            exit 1
          }
          $files | Sort-Object FullName | ForEach-Object { "{0}`t{1:N0} bytes" -f $_.Name, $_.Length }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: winsur-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/winsur.exe
          if-no-files-found: error

      - name: Smoke test portable exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-window.ps1 -Exe target/release/winsur.exe -Label portable -OutDir smoke-out

      - name: Smoke test NSIS install
        shell: powershell
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "NSIS setup missing"; exit 1 }
          $dest = Join-Path $env:TEMP "winsur-nsis-smoke"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Write-Output "installing $($setup.FullName) to $dest"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $setup.FullName
          # CreateProcess keeps /D= on the real command line. ShellExecute drops it
          # when NSIS relaunches, and installMode "both" still defaults to
          # %LOCALAPPDATA%\Winsur when /D is not applied.
          $psi.Arguments = "/S /CURRENTUSER /D=$dest"
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = $env:TEMP
          $installer = [System.Diagnostics.Process]::Start($psi)
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            Write-Error "NSIS installer timed out"
            exit 1
          }
          Write-Output "installer exit $($installer.ExitCode)"
          $setupName = [System.IO.Path]::GetFileNameWithoutExtension($setup.Name)
          $deadline = (Get-Date).AddSeconds(60)
          do {
            $still = @(Get-Process -Name $setupName -ErrorAction SilentlyContinue)
            if ($still.Count -eq 0) { break }
            Write-Output "setup still running: $($still.Id -join ',')"
            Start-Sleep -Seconds 1
          } while ((Get-Date) -lt $deadline)
          if ($installer.ExitCode -ne 0) {
            Write-Error "NSIS installer exit code $($installer.ExitCode)"
            exit 1
          }
          $portableExe = (Resolve-Path "target\release\winsur.exe").Path
          $scanRoots = @(
            $dest,
            (Join-Path $env:LOCALAPPDATA "Winsur"),
            (Join-Path $env:TEMP "placeholder\Winsur"),
            (Join-Path (Get-Location).Path "placeholder\Winsur"),
            (Join-Path $setup.DirectoryName "placeholder\Winsur"),
            (Join-Path ${env:ProgramFiles} "Winsur"),
            $env:LOCALAPPDATA,
            $env:TEMP,
            $setup.DirectoryName,
            (Get-Location).Path
          )
          $installed = $null
          foreach ($key in @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Winsur",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Winsur"
          )) {
            $prop = Get-ItemProperty -Path $key -ErrorAction SilentlyContinue
            if (-not $prop) { Write-Output "reg $key missing"; continue }
            Write-Output "reg $key location=$($prop.InstallLocation) uninstall=$($prop.UninstallString)"
            if ($prop.InstallLocation) {
              $fromReg = Join-Path ($prop.InstallLocation.Trim('"')) "winsur.exe"
              if (Test-Path -LiteralPath $fromReg) { $installed = (Resolve-Path -LiteralPath $fromReg).Path; break }
            }
          }
          if (-not $installed) {
            foreach ($root in $scanRoots) {
              if (-not (Test-Path -LiteralPath $root)) { continue }
              $found = @(Get-ChildItem -LiteralPath $root -Recurse -Filter "winsur.exe" -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -ne $portableExe })
              if ($found.Count -gt 0) {
                $found | ForEach-Object { Write-Output "candidate $($_.FullName)" }
                $installed = $found[0].FullName
                break
              }
            }
          }
          if (-not $installed) {
            Write-Error "installed winsur.exe not found"
            exit 1
          }
          Write-Output "installed $installed"
          $portableItem = Get-Item -LiteralPath $portableExe
          $installedItem = Get-Item -LiteralPath $installed
          $portableHash = (Get-FileHash -LiteralPath $portableItem.FullName -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash -LiteralPath $installedItem.FullName -Algorithm SHA256).Hash
          Write-Output "portable $($portableItem.Length) bytes $portableHash"
          Write-Output "nsis     $($installedItem.Length) bytes $installedHash"
          if ($installedItem.Length -lt 1MB) {
            Write-Error "installed winsur.exe is too small to be the app"
            exit 1
          }
          if ($portableHash -ne $installedHash) {
            Write-Output "hash differs because the NSIS bundle edits the exe resources; smoking the installed binary"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-window.ps1 -Exe $installed -Label nsis -OutDir smoke-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Join-Path (Split-Path -Parent $installed) "uninstall.exe"
          if (Test-Path -LiteralPath $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru
            $null = $uninstall.WaitForExit(120000)
          }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winsur-smoke
          path: smoke-out/**
          if-no-files-found: warn

  electron-pr1:
    name: PR1 Electron build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-clickthrough-agents-8202

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and bundle
        run: npm run build

      - name: Syntax-check Electron main
        shell: pwsh
        run: |
          Get-ChildItem electron -Filter *.cjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: electron-pr1-dist
          path: dist/**
          if-no-files-found: error
