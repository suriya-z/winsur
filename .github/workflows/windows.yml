name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Frontend bundle
        run: npx vite build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Parity checklist
        shell: pwsh
        run: |
          $open = Select-String -Path docs/tauri-parity.md -Pattern '^- \[ \]'
          if ($open) {
            $open | ForEach-Object { Write-Host $_.Line }
            Write-Error "docs/tauri-parity.md still has unchecked items"
            exit 1
          }
          $done = Select-String -Path docs/tauri-parity.md -Pattern '^- \[x\]'
          if (-not $done) {
            Write-Error "docs/tauri-parity.md has no completed items"
            exit 1
          }

      - name: Package
        run: npm run dist

      - name: Installer sizes
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem -Path target/release/bundle/nsis -Filter *.exe -File)
            (Get-ChildItem -Path target/release/bundle/msi -Filter *.msi -File)
            (Get-Item target/release/winsur.exe)
          )
          if ($files.Count -lt 3) {
            Write-Error "expected NSIS, MSI, and winsur.exe under target/release"
            exit 1
          }
          $files | Sort-Object FullName | ForEach-Object { "{0}`t{1:N0} bytes" -f $_.Name, $_.Length }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: winsur-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/winsur.exe
          if-no-files-found: error

      - name: Smoke test portable exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-window.ps1 -Exe target/release/winsur.exe -Label portable -OutDir smoke-out

      - name: Smoke test NSIS install
        shell: powershell
        run: |
          $setup = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $setup) { Write-Error "NSIS setup missing"; exit 1 }
          $dest = Join-Path $env:TEMP "winsur-nsis-smoke"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          Write-Output "installing $($setup.FullName) to $dest"
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $setup.FullName
          # CreateProcess keeps /D= on the real command line. ShellExecute drops it
          # when NSIS relaunches, and installMode "both" still defaults to
          # %LOCALAPPDATA%\Winsur when /D is not applied.
          $psi.Arguments = "/S /CURRENTUSER /D=$dest"
          $psi.UseShellExecute = $false
          $installer = [System.Diagnostics.Process]::Start($psi)
          if (-not $installer.WaitForExit(180000)) {
            Stop-Process -Id $installer.Id -Force -ErrorAction SilentlyContinue
            Write-Error "NSIS installer timed out"
            exit 1
          }
          Write-Output "installer exit $($installer.ExitCode)"
          if ($installer.ExitCode -ne 0) {
            Write-Error "NSIS installer exit code $($installer.ExitCode)"
            exit 1
          }
          $searchRoots = @(
            $dest,
            (Join-Path $env:LOCALAPPDATA "Winsur"),
            (Join-Path ${env:ProgramFiles} "Winsur")
          )
          $installed = $null
          foreach ($root in $searchRoots) {
            foreach ($name in @("winsur.exe", "Winsur.exe")) {
              $candidate = Join-Path $root $name
              if (Test-Path -LiteralPath $candidate) { $installed = $candidate; break }
            }
            if ($installed) { break }
            if (Test-Path -LiteralPath $root) {
              $found = Get-ChildItem -LiteralPath $root -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -match '^(?i)winsur\.exe$' } |
                Select-Object -First 1
              if ($found) { $installed = $found.FullName; break }
            }
          }
          if (-not $installed) {
            foreach ($root in $searchRoots) {
              Write-Output "---- $root ----"
              if (Test-Path -LiteralPath $root) {
                Get-ChildItem -LiteralPath $root -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Output $_.FullName }
              } else {
                Write-Output "(missing)"
              }
            }
            Write-Error "installed winsur.exe not found"
            exit 1
          }
          Write-Output "installed $installed"
          $portableHash = (Get-FileHash target/release/winsur.exe -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          Write-Output "portable sha256 $portableHash"
          Write-Output "nsis sha256     $installedHash"
          if ($portableHash -ne $installedHash) {
            Write-Error "NSIS extracted a different winsur.exe than target/release/winsur.exe"
            exit 1
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-window.ps1 -Exe $installed -Label nsis -OutDir smoke-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $uninstaller = Join-Path (Split-Path -Parent $installed) "uninstall.exe"
          if (Test-Path -LiteralPath $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -PassThru
            $null = $uninstall.WaitForExit(120000)
          }

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winsur-smoke
          path: smoke-out/**
          if-no-files-found: warn

  electron-pr1:
    name: PR1 Electron build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/fix-clickthrough-agents-8202

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and bundle
        run: npm run build

      - name: Syntax-check Electron main
        shell: pwsh
        run: |
          Get-ChildItem electron -Filter *.cjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: electron-pr1-dist
          path: dist/**
          if-no-files-found: error
