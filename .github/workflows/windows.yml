name: Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Parity checklist
        shell: pwsh
        run: |
          $open = Select-String -Path docs/tauri-parity.md -Pattern '^- \[ \]'
          if ($open) {
            $open | ForEach-Object { Write-Host $_.Line }
            Write-Error "docs/tauri-parity.md still has unchecked items"
            exit 1
          }
          $done = Select-String -Path docs/tauri-parity.md -Pattern '^- \[x\]'
          if (-not $done) {
            Write-Error "docs/tauri-parity.md has no completed items"
            exit 1
          }

      - name: Package
        run: npm run dist

      - name: Installer sizes
        shell: pwsh
        run: |
          $paths = @(
            "src-tauri/target/release/bundle",
            "src-tauri/target/release/winsur.exe"
          )
          Get-ChildItem -Path $paths -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            ForEach-Object { "{0}`t{1:N0} bytes" -f $_.FullName, $_.Length }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: winsur-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/winsur.exe
          if-no-files-found: error
