name: Release

# Tag a commit on main (git tag v0.1.2 && git push origin v0.1.2) and this
# builds the Windows installers and attaches them to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build installers
        run: npm run dist

      - name: Installer sizes
        shell: pwsh
        run: |
          Get-ChildItem -Path src-tauri/target/release/bundle, src-tauri/target/release/winsur.exe -Recurse -File -ErrorAction SilentlyContinue |
            ForEach-Object { "{0}`t{1:N0} bytes" -f $_.Name, $_.Length }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/winsur.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
