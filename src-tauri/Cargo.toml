[package]
name = "winsur"
version = "0.1.1"
description = "Winsur — multi-agent control surface for Windows"
authors = ["wwz"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "winsur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
winsur-core = { path = "../crates/winsur-core" }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
